name: Bootstrap Improved Chat

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -d .bootstrap ] && compgen -G '.bootstrap/part-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            .bootstrap/part-00a \
            .bootstrap/part-00b \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/part-03a \
            .bootstrap/part-03b \
            .bootstrap/part-04a \
            .bootstrap/part-04b1 \
            .bootstrap/part-04b2 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            .bootstrap/part-07 \
            > /tmp/improved-chat.zip
          echo '453eee58a92dcd9dabfaca2ddedcb92dd07b1967a0263ea26b366a7c8a98ad31  /tmp/improved-chat.zip' | sha256sum -c -
          rm -rf /tmp/improved-chat
          mkdir -p /tmp/improved-chat
          unzip -q /tmp/improved-chat.zip -d /tmp/improved-chat
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/improved-chat/. .

      - uses: actions/setup-java@v4
        if: steps.payload.outputs.present == 'true'
        with:
          distribution: zulu
          java-version: '13'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.payload.outputs.present == 'true'
        with:
          gradle-version: '8.10'

      - name: Run RuneLite build and tests
        if: steps.payload.outputs.present == 'true'
        run: gradle clean test --no-daemon

      - name: Commit verified source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Improved Chat plugin source'
          git push
