name: Validate Chat Cleanup

on:
  push:
    branches:
      - review-2-chat-cleanup

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Clean, test, and build
        run: gradle clean test jar --stacktrace
      - name: Runtime plugin-load smoke test
        shell: bash
        run: |
          set +e
          timeout 60s xvfb-run -a gradle run --stacktrace > runtime-smoke.log 2>&1
          smoke_rc=$?
          set -e
          cat runtime-smoke.log
          if grep -Eq "Error instantiating plugin.*ImprovedChatPlugin|Unable to start plugin ImprovedChatPlugin|CreationException.*ImprovedChatPlugin|ImprovedChatConfig.*has no @ConfigItem" runtime-smoke.log; then
            exit 1
          fi
          if ! grep -Eq "Loaded plugin ImprovedChatPlugin|ImprovedChatPlugin is now running" runtime-smoke.log; then
            echo "RuneLite never confirmed ImprovedChatPlugin loaded (process exit: $smoke_rc)"
            exit 1
          fi
