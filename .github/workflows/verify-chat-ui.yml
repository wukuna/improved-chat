name: Verify consolidated chat UI

on:
  push:
    branches:
      - chat-ui-verification
    paths:
      - '.github/workflows/verify-chat-ui.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run full clean test suite
        run: gradle clean test --no-daemon
