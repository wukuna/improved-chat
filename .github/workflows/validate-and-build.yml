name: Validate and build Improved Chat

on:
  push:
    branches:
      - build-validation-2026-09-19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Clean, test, and build
        run: gradle clean test jar --stacktrace

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: improved-chat-dev-7c10a91
          path: build/libs/*.jar
          if-no-files-found: error
