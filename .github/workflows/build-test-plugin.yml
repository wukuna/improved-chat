name: Build Improved Chat Release

on:
  push:
    branches:
      - release-plugin-hub-2026-09-20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Clean, test, and build
        run: gradle clean test jar --stacktrace
      - name: Runtime plugin-load smoke test
        shell: bash
        run: |
          set +e
          timeout 60s xvfb-run -a gradle run --stacktrace > runtime-smoke.log 2>&1
          smoke_rc=$?
          set -e
          cat runtime-smoke.log

          if grep -Eq "Error instantiating plugin.*ImprovedChatPlugin|Unable to start plugin ImprovedChatPlugin|CreationException.*ImprovedChatPlugin" runtime-smoke.log; then
            echo "Improved Chat failed RuneLite plugin instantiation"
            exit 1
          fi

          if grep -Eq "ImprovedChatConfig.*has no @ConfigItem" runtime-smoke.log; then
            echo "ImprovedChatConfig contains a non-config method invoked through RuneLite's config proxy"
            exit 1
          fi

          if ! grep -Eq "Loaded plugin ImprovedChatPlugin|ImprovedChatPlugin is now running" runtime-smoke.log; then
            echo "RuneLite never confirmed ImprovedChatPlugin loaded (process exit: $smoke_rc)"
            exit 1
          fi
      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: Improved-Chat-Release
          path: build/libs/*.jar
          if-no-files-found: error
